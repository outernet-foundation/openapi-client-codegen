[project]
name = "openapi-client-codegen"
version = "0.0.0.dev0"
description = "OpenAPI client-generation wrapper: Litestar spec dump, 3.1->3.0 downgrade, patched openapi-generator templates, Unity package metadata"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "typer>=0.17.4",
]

[dependency-groups]
dev = ["basedpyright>=1.39.10", "ruff>=0.14.11", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
openapi-client-codegen = "openapi_client_codegen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_client_codegen"]
include = [
    "src/openapi_clientgen/py.typed",
    "src/openapi_clientgen/_data/**",
]

[tool.uv.sources]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "openapi-clientgen"
version = "0.1.0"
description = "OpenAPI client-generation wrapper: Litestar spec dump, 3.1->3.0 downgrade, patched openapi-generator templates, Unity package metadata"
requires-python = ">=3.13"
dependencies = [
    "bashrun",
    "typer>=0.17.4",
]

[dependency-groups]
dev = ["basedpyright>=1.28.0", "ruff>=0.14.11", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
openapi-clientgen = "openapi_clientgen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_clientgen"]
include = [
    "src/openapi_clientgen/py.typed",
    "src/openapi_clientgen/_data/**",
]

[tool.uv.sources]
bashrun = { git = "https://github.com/outernet-foundation/bashrun.git", rev = "570290bf6f1a6873f060f95a766fb7649837f54a" }

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

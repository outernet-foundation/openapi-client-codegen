[project]
name = "openapi-clientgen"
version = "0.1.0"
description = "OpenAPI client-generation wrapper: Litestar spec dump, 3.1->3.0 downgrade, patched openapi-generator templates, Unity package metadata"
requires-python = ">=3.13"
dependencies = [
    "bashrun",
    "typer>=0.17.4",
]

[dependency-groups]
dev = ["basedpyright>=1.39.10", "ruff>=0.14.11", "pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
openapi-clientgen = "openapi_clientgen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_clientgen"]
include = [
    "src/openapi_clientgen/py.typed",
    "src/openapi_clientgen/_data/**",
]

[tool.uv.sources]
bashrun = { git = "https://github.com/outernet-foundation/bashrun.git", rev = "0a9e9a466a3ef99c95e316a6f46842741d32ca11" }

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
